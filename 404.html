<!DOCTYPE html>
<html lang="en-US">

<head>
  <!-- =========================================================
    1. BASE & INDEXING
  ========================================================== -->
  <meta charset="UTF-8" />
  <meta name="robots" content="index, follow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />

  <!-- =========================================================
    2. PAGE TITLE
  ========================================================== -->
  <title>404 - Page not found</title>

  <!-- =========================================================
    5. CRITICAL CSS (RENDER-BLOCKING)
  ========================================================== -->
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      color: inherit;
      list-style: none;
      text-decoration: none;
      cursor: default;
      box-sizing: border-box;
    }

    body {
      background-color: #f0f1f5;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 2rem;
    }

    h1 {
      font-size: 6rem;
      color: #333;
    }

    h2 {
      font-size: 1.75rem;
      color: #555;
      margin-bottom: 1rem;
    }

    p {
      color: #666;
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    a.button {
      background-color: #2c5531;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      padding: 0.75rem 1.5rem;
      display: inline-block;
      transition: background 1.5s;
    }

    a.button:hover {
      background-color: #333;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 4rem;
      }

      h2 {
        font-size: 1.5rem;
      }
    }
  </style>

  <!-- =========================================================
        5. FAVICONS
      ========================================================== -->
  <link rel="icon" type="image/png" href="./assets/favicons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicons/favicon.svg" />
  <link rel="shortcut icon" href="./assets/favicons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Bento's Group" />
</head>

<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>
      The URL you tried to access doesn't exist or has been removed.
      <br>You can return to the homepage or contact us.
    </p>
    <a href="index.html" class="button">Go to Home Page</a>
  </div>
<script src="/js/lead-events.js"></script>
</body>

</html>
