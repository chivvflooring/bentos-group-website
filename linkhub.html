<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />

    <title>Bento's Group | LinkHub</title>
    <meta name="description"
        content="Official LinkHub of Bento's Group. Access all our contacts and important links in one place." />
    <link rel="canonical" href="https://bentos-group.com/linkhub" />

    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" as="style"
        onload="this.onload=null;this.rel='stylesheet'">

    <!-- CSS LinkHub -->
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #f0efea;
            --text-color: #222;
            --primary-color: #75907b;
            --secondary-color: #e3d4bf;
            --light-green: #d3ddc2;
            --white-color: #fefefe;
        }

        body {
            margin: 0;
            padding: 40px;
            padding-bottom: 0;
            min-height: 100dvh;

            background: var(--bg-color);
            background-image: linear-gradient(to right, #e0e0e0 1px, transparent 1px), linear-gradient(to bottom, #e0e0e0 1px, transparent 1px);
            background-size: 200px 200px;

            font-family: 'Arial', sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;

            scroll-behavior: smooth;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            margin: 0;
            margin-bottom: 14px;
            border-radius: 50px;
            padding: 10px 35px;

            background: var(--white-color);
            color: var(--text-color);

            box-shadow: 0px 0px 2px 2px rgba(0, 0, 0, 0.1);
            -webkit-box-shadow: 0px 0px 2px 2px rgba(0, 0, 0, 0.1);

            font-size: clamp(16px, 8vw, 44px);

            text-align: center;
        }

        .logo {
            margin: 20px 0 40px;
            border: 4px solid var(--primary-color);
            border-radius: 50%;
            padding: 5px;
            width: 120px;
            height: 120px;

            outline: 3px solid var(--bg-color);
            outline-offset: -7px;

            background-color: var(--secondary-color);
            background-image: url(./assets/images/bentos-group-combination-mark.png);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-origin: content-box;

            box-shadow: 0px 8px 15px 8px rgba(0, 0, 0, 0.2);
            -webkit-box-shadow: 0px 8px 15px 8px rgba(0, 0, 0, 0.2);
        }

        .intro {
            text-align: center;
            color: #444;
            max-width: 400px;
            line-height: 1.5;
            font-size: 15px;
        }

        [class*="flex"] {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .links-container {
            margin-bottom: 20px;
            gap: 15px;
        }

        .links-container:last-child {
            border-radius: 50px;
            padding: 10px;

            background: var(--white-color);

            box-shadow: 0px 5px 15px 0px rgba(0, 0, 0, 0.3);
            -webkit-box-shadow: 0px 5px 15px 0px rgba(0, 0, 0, 0.3);
        }

        .link-circle-button {
            border-radius: 50%;
            padding: 10px;
            background: var(--secondary-color);
            color: var(--text-color);

            font-size: 1.5rem;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            transition: all 0.2s ease;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 40px;
            background: var(--secondary-color);
            color: var(--text-color);
            font-size: 1.5rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 50px;
            outline: 2px solid var(--primary-color);
            outline-offset: -10px;
            transition: all 0.2s ease;

            box-shadow: 0px 5px 15px 0px rgba(0, 0, 0, 0.3);
            -webkit-box-shadow: 0px 5px 15px 0px rgba(0, 0, 0, 0.3);
        }

        .link-button:first-of-type {
            background: var(--white-color);
        }

        .link-button:last-of-type {
            background: var(--light-green);
        }

        .link-button i {
            margin-right: 10px;
        }

        .link-circle-button:hover,
        .link-button:hover {
            background: var(--text-color);
            color: var(--white-color);
            outline-color: var(--white-color);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        footer {
            padding: 20px;
            width: 100dvw;

            background: var(--secondary-color);
            color: #444;

            box-shadow: 0px 4px 20px 0px rgba(0, 0, 0, 0.3);
            -webkit-box-shadow: 0px 5px 20px 0px rgba(0, 0, 0, 0.3);

            font-size: 14px;

            text-align: center;
        }
    </style>

    <!-- =========================================================
        5. FAVICONS
      ========================================================== -->
    <link rel="icon" type="image/png" href="./assets/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicons/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Bento's Group" />
</head>

<body>
    <main>

        <h1 class="title">Bento's Group</h1>
        <div class="logo"></div>

        <section class="links-container flex-col">
            <a class="link-button" href="https://bentos-group.com" target="_blank">
                <i class="fas fa-globe"></i> Website
            </a>
            <a class="link-button" href="sms:+16785717028?body=Hello!" target="_blank">
                <i class="fas fa-sms"></i> SMS
            </a>
            <a class="link-button"
                href="https://www.google.com/maps/place/Bento%E2%80%99s+Group+Construction/data=!4m2!3m1!1s0x0:0xc712d699554a97b6?sa=X&ved=1t:2428&ictx=111"
                target="_blank">
                <i class="fab fa-google"></i> Google Business Profile
            </a>
        </section>

        <section class="links-container flex">
            <a class="link-circle-button" href="https://instagram.com/bentosgroupconstruction" target="_blank">
                <i class="fab fa-square-instagram"></i>
            </a>
            <a class="link-circle-button" href="mailto:charlesbgroup@gmail.com" target="_blank">
                <i class="fas fa-envelope"></i>
            </a>
        </section>

    </main>

    <footer>
        <p>© 2026 Bento's Group. All rights reserved.</p>
    </footer>
<script src="/js/lead-events.js"></script>
</body>

</html>
