name: Website quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '25 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check:website
      - if: github.event_name == 'schedule'
        run: npm run check:website
        env:
          HEALTH_SITE: https://bentos-group.com
          LEAD_OPERATIONS_TOKEN: ${{ secrets.LEAD_OPERATIONS_READ_TOKEN }}
